[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria-ai-anti"
version = "2.1.0"
description = "Engram AI — AI Memory Vault: Self-hosted AI Conversation Vault, Hybrid Search & Epistemic Knowledge Graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "numpy>=1.24.0,<2.0.0"
]

[project.scripts]
memoria = "memoria.cli.main:main"

[tool.setuptools.packages.find]
include = ["memoria*"]
