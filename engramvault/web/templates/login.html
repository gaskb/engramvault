<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0c0f17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EngramVault">
    <title>Login — EngramVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f1117; color: #f1f5f9; }
        .glass-card { background: rgba(24, 29, 39, 0.92); backdrop-filter: blur(12px); border: 1px solid #262f40; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="glass-card w-full max-w-md rounded-2xl p-7 shadow-2xl space-y-6">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                E
            </div>
            <div>
                <h1 class="text-lg font-bold text-white">EngramVault</h1>
                <p class="text-xs text-slate-400">Protected Conversation Vault & Knowledge Layer</p>
            </div>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">Web UI Access Password</label>
                <input type="password" id="login-password" required autofocus
                       placeholder="Enter vault password..."
                       class="w-full bg-[#10141d] border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/30 rounded-lg p-2.5">
                Invalid password. Please try again.
            </div>
            <button type="submit" id="login-btn"
                    class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm transition shadow-lg flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
                <span>Unlock Vault</span>
            </button>
        </form>

        <div class="pt-3 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-500 font-mono">
            <span>EngramVault v{{ app_version or '2.11.0' }}</span>
            <span>REST API {{ api_version or 'v1' }} · MCP {{ mcp_version or '2.0' }}</span>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error');
            errBox.classList.add('hidden');
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = 'Network error: ' + err;
                errBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
