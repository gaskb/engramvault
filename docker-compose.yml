services:
  engramvault:
    image: gaskb/engramvault:latest
    container_name: engramvault
    restart: unless-stopped
    ports:
      - "5006:8080"
    volumes:
      - ./data:/app/data
    environment:
      - ENGRAMVAULT_DB_PATH=/app/data/vault.db
      - ENGRAMVAULT_DATA_DIR=/app/data
      - ENGRAMVAULT_DEFAULT_LANG=en
      - ENGRAMVAULT_DEFAULT_THEME=emerald
      - ENGRAMVAULT_EMBEDDING_BACKEND=auto
      # Optional: Web & API Security
      # - ENGRAMVAULT_API_TOKEN=your_bearer_token_here
      # - ENGRAMVAULT_WEB_PASSWORD=your_web_password_here
      # Optional: External LLM Provider (Gemini, OpenAI, Anthropic, Ollama, Grok, DeepSeek)
      # - ENGRAMVAULT_LLM_PROVIDER=gemini
      # - ENGRAMVAULT_LLM_API_KEY=your_api_key_here
      # - ENGRAMVAULT_LLM_MODEL=gemini-2.0-flash
