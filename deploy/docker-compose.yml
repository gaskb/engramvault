version: '3.8'

services:
  memoria:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: engramvault
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
      - ~/.claude/projects:/root/.claude/projects:ro
    environment:
      - MEMORIA_DB_PATH=/app/data/vault.db
      - MEMORIA_DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
